<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Planta industrial con equipos de refrigeración">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a49"/><stop offset=".55" stop-color="#123a63"/><stop offset="1" stop-color="#1b5185"/>
    </linearGradient>
    <linearGradient id="edif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12406b"/><stop offset="1" stop-color="#081f38"/>
    </linearGradient>
    <linearGradient id="edif2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175186"/><stop offset="1" stop-color="#0c2c4d"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity=".95"/><stop offset="1" stop-color="#2f7fd1" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#63b0f5" stop-opacity=".55"/><stop offset="1" stop-color="#63b0f5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#cielo)"/>
  <circle cx="1180" cy="250" r="420" fill="url(#halo)"/>

  <!-- cordillera -->
  <path d="M0 520 L180 400 L300 470 L440 350 L560 460 L700 380 L860 500 L1010 410 L1180 520 L1330 440 L1470 530 L1600 470 L1600 900 L0 900Z" fill="#0a2540" opacity=".55"/>
  <path d="M0 600 L200 520 L360 580 L520 500 L700 590 L900 520 L1080 600 L1280 540 L1450 610 L1600 560 L1600 900 L0 900Z" fill="#081f38" opacity=".8"/>

  <!-- nave industrial principal -->
  <g>
    <rect x="180" y="470" width="520" height="330" rx="10" fill="url(#edif)"/>
    <rect x="180" y="470" width="520" height="16" rx="6" fill="#2f7fd1" opacity=".55"/>
    <g fill="url(#vidrio)" opacity=".85">
      <rect x="220" y="520" width="66" height="46" rx="6"/><rect x="304" y="520" width="66" height="46" rx="6"/>
      <rect x="388" y="520" width="66" height="46" rx="6"/><rect x="472" y="520" width="66" height="46" rx="6"/>
      <rect x="556" y="520" width="66" height="46" rx="6"/>
      <rect x="220" y="592" width="66" height="46" rx="6" opacity=".6"/><rect x="304" y="592" width="66" height="46" rx="6" opacity=".35"/>
      <rect x="388" y="592" width="66" height="46" rx="6" opacity=".75"/><rect x="472" y="592" width="66" height="46" rx="6" opacity=".45"/>
      <rect x="556" y="592" width="66" height="46" rx="6" opacity=".7"/>
    </g>
    <rect x="330" y="680" width="180" height="120" rx="8" fill="#061a2e"/>
    <rect x="352" y="700" width="136" height="80" rx="4" fill="#12406b"/>
    <path d="M352 740h136" stroke="#2f7fd1" stroke-width="3" opacity=".7"/>
  </g>

  <!-- torre / edificio corporativo -->
  <g>
    <rect x="740" y="300" width="300" height="500" rx="12" fill="url(#edif2)"/>
    <g fill="url(#vidrio)" opacity=".8">
      <rect x="772" y="340" width="52" height="40" rx="5"/><rect x="840" y="340" width="52" height="40" rx="5" opacity=".5"/>
      <rect x="908" y="340" width="52" height="40" rx="5"/><rect x="976" y="340" width="34" height="40" rx="5" opacity=".6"/>
      <rect x="772" y="400" width="52" height="40" rx="5" opacity=".55"/><rect x="840" y="400" width="52" height="40" rx="5"/>
      <rect x="908" y="400" width="52" height="40" rx="5" opacity=".4"/><rect x="976" y="400" width="34" height="40" rx="5"/>
      <rect x="772" y="460" width="52" height="40" rx="5"/><rect x="840" y="460" width="52" height="40" rx="5" opacity=".45"/>
      <rect x="908" y="460" width="52" height="40" rx="5" opacity=".8"/><rect x="976" y="460" width="34" height="40" rx="5" opacity=".5"/>
      <rect x="772" y="520" width="52" height="40" rx="5" opacity=".5"/><rect x="840" y="520" width="52" height="40" rx="5" opacity=".7"/>
      <rect x="908" y="520" width="52" height="40" rx="5" opacity=".35"/><rect x="976" y="520" width="34" height="40" rx="5" opacity=".65"/>
      <rect x="772" y="580" width="52" height="40" rx="5" opacity=".7"/><rect x="840" y="580" width="52" height="40" rx="5" opacity=".4"/>
      <rect x="908" y="580" width="52" height="40" rx="5" opacity=".6"/><rect x="976" y="580" width="34" height="40" rx="5" opacity=".3"/>
    </g>
  </g>

  <!-- unidades condensadoras en techo -->
  <g stroke="#7fc0f7" stroke-width="3" fill="#0a2540" opacity=".95">
    <g transform="translate(230,398)">
      <rect x="0" y="0" width="120" height="72" rx="8"/>
      <circle cx="38" cy="36" r="21" fill="none"/><circle cx="38" cy="36" r="5" fill="#7fc0f7" stroke="none"/>
      <path d="M38 15v42M17 36h42M23 21l30 30M53 21 23 51" stroke-width="2" opacity=".65"/>
      <rect x="76" y="14" width="30" height="44" rx="4" fill="#12406b"/>
    </g>
    <g transform="translate(400,398)">
      <rect x="0" y="0" width="120" height="72" rx="8"/>
      <circle cx="38" cy="36" r="21" fill="none"/><circle cx="38" cy="36" r="5" fill="#7fc0f7" stroke="none"/>
      <path d="M38 15v42M17 36h42M23 21l30 30M53 21 23 51" stroke-width="2" opacity=".65"/>
      <rect x="76" y="14" width="30" height="44" rx="4" fill="#12406b"/>
    </g>
    <g transform="translate(800,232)">
      <rect x="0" y="0" width="150" height="68" rx="8"/>
      <circle cx="44" cy="34" r="20" fill="none"/><circle cx="44" cy="34" r="5" fill="#7fc0f7" stroke="none"/>
      <circle cx="106" cy="34" r="20" fill="none"/><circle cx="106" cy="34" r="5" fill="#7fc0f7" stroke="none"/>
    </g>
  </g>

  <!-- ductos -->
  <g stroke="#2f7fd1" stroke-width="10" fill="none" opacity=".5" stroke-linecap="round">
    <path d="M700 560h60v-90h50"/>
    <path d="M1040 640h120v100"/>
  </g>

  <!-- contenedor reefer -->
  <g transform="translate(1120,600)">
    <rect x="0" y="0" width="380" height="190" rx="10" fill="#0c2c4d" stroke="#3d8fe0" stroke-width="3"/>
    <g stroke="#1d5b96" stroke-width="4" opacity=".85">
      <path d="M110 12v166M150 12v166M190 12v166M230 12v166M270 12v166M310 12v166M350 12v166"/>
    </g>
    <rect x="12" y="12" width="82" height="166" rx="6" fill="#12406b" stroke="#3d8fe0" stroke-width="2"/>
    <circle cx="53" cy="70" r="24" fill="none" stroke="#8fd0ff" stroke-width="3"/>
    <path d="M53 46v48M29 70h48M36 53l34 34M70 53 36 87" stroke="#8fd0ff" stroke-width="2" opacity=".7"/>
    <rect x="30" y="112" width="46" height="26" rx="4" fill="#0a2540" stroke="#8fd0ff" stroke-width="2"/>
    <path d="M38 125h30" stroke="#8fd0ff" stroke-width="3"/>
  </g>

  <!-- copos / frío -->
  <g stroke="#bcd8f5" stroke-width="2.4" opacity=".35" stroke-linecap="round">
    <g transform="translate(1240,220)"><path d="M0-26v52M-26 0h52M-18-18 18 18M18-18-18 18"/></g>
    <g transform="translate(1420,360) scale(.7)"><path d="M0-26v52M-26 0h52M-18-18 18 18M18-18-18 18"/></g>
    <g transform="translate(1090,150) scale(.5)"><path d="M0-26v52M-26 0h52M-18-18 18 18M18-18-18 18"/></g>
  </g>

  <rect y="760" width="1600" height="140" fill="#061a2e" opacity=".55"/>
</svg>
